name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Compile binaries (all 8 targets)
        working-directory: packages/cli
        run: bun run compile

      - name: Source-map leak guard
        run: |
          if find packages/cli/dist/binaries -name '*.map' | grep -q .; then
            echo "ERROR: .map files found in binary output — source-map leak guard failed"
            find packages/cli/dist/binaries -name '*.map'
            exit 1
          fi

      - name: Package compressed binaries and SBOMs
        run: |
          export BUN_VERSION="$(bun --version)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          node scripts/package-binaries.mjs

      - name: Attest release binaries and archives
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-checksums: packages/cli/dist/binaries/checksums.txt

      - name: Attest SBOM for tila-darwin-arm64
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-darwin-arm64
            packages/cli/dist/binaries/tila-darwin-arm64.gz
          sbom-path: packages/cli/dist/binaries/tila-darwin-arm64.spdx.json

      - name: Attest SBOM for tila-darwin-x64
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-darwin-x64
            packages/cli/dist/binaries/tila-darwin-x64.gz
          sbom-path: packages/cli/dist/binaries/tila-darwin-x64.spdx.json

      - name: Attest SBOM for tila-linux-x64
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-linux-x64
            packages/cli/dist/binaries/tila-linux-x64.gz
          sbom-path: packages/cli/dist/binaries/tila-linux-x64.spdx.json

      - name: Attest SBOM for tila-linux-arm64
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-linux-arm64
            packages/cli/dist/binaries/tila-linux-arm64.gz
          sbom-path: packages/cli/dist/binaries/tila-linux-arm64.spdx.json

      - name: Attest SBOM for tila-linux-x64-musl
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-linux-x64-musl
            packages/cli/dist/binaries/tila-linux-x64-musl.gz
          sbom-path: packages/cli/dist/binaries/tila-linux-x64-musl.spdx.json

      - name: Attest SBOM for tila-linux-arm64-musl
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-linux-arm64-musl
            packages/cli/dist/binaries/tila-linux-arm64-musl.gz
          sbom-path: packages/cli/dist/binaries/tila-linux-arm64-musl.spdx.json

      - name: Attest SBOM for tila-windows-x64.exe
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-windows-x64.exe
            packages/cli/dist/binaries/tila-windows-x64.exe.gz
          sbom-path: packages/cli/dist/binaries/tila-windows-x64.exe.spdx.json

      - name: Attest SBOM for tila-windows-arm64.exe
        uses: actions/attest-sbom@4c8abdcbea4a6b66f70fd1169e70af4bf5b13701
        with:
          subject-path: |
            packages/cli/dist/binaries/tila-windows-arm64.exe
            packages/cli/dist/binaries/tila-windows-arm64.exe.gz
          sbom-path: packages/cli/dist/binaries/tila-windows-arm64.exe.spdx.json

      - name: Verify release attestations before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r digest asset; do
            gh attestation verify "packages/cli/dist/binaries/$asset" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "packages/cli/dist/binaries/$asset" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
          done < packages/cli/dist/binaries/checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: packages/cli/dist/binaries/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries for npm publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-binaries
          path: packages/cli/dist/binaries/*
          retention-days: 1

  npm-publish:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest # OIDC trusted publishing requires npm >= 11.5.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package for publish
        run: pnpm build

      - name: Publish SDK and MCP server (OIDC)
        run: |
          pnpm --filter tila-sdk publish --no-git-checks --access public --provenance
          pnpm --filter tila-mcp-server publish --no-git-checks --access public --provenance

      - name: Download compiled binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-binaries
          path: packages/cli/dist/binaries

      - name: Copy binaries to platform packages
        run: |
          cp packages/cli/dist/binaries/tila-darwin-arm64 packages/cli-darwin-arm64/bin/tila
          cp packages/cli/dist/binaries/tila-darwin-x64 packages/cli-darwin-x64/bin/tila
          cp packages/cli/dist/binaries/tila-linux-x64 packages/cli-linux-x64/bin/tila
          cp packages/cli/dist/binaries/tila-linux-arm64 packages/cli-linux-arm64/bin/tila
          cp packages/cli/dist/binaries/tila-linux-x64-musl packages/cli-linux-x64-musl/bin/tila
          cp packages/cli/dist/binaries/tila-linux-arm64-musl packages/cli-linux-arm64-musl/bin/tila
          cp packages/cli/dist/binaries/tila-windows-x64.exe packages/cli-windows-x64/bin/tila.exe
          cp packages/cli/dist/binaries/tila-windows-arm64.exe packages/cli-windows-arm64/bin/tila.exe
          chmod +x packages/cli-darwin-arm64/bin/tila
          chmod +x packages/cli-darwin-x64/bin/tila
          chmod +x packages/cli-linux-x64/bin/tila
          chmod +x packages/cli-linux-arm64/bin/tila
          chmod +x packages/cli-linux-x64-musl/bin/tila
          chmod +x packages/cli-linux-arm64-musl/bin/tila

      - name: Publish platform packages (OIDC)
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-linux-x64-musl cli-linux-arm64-musl cli-windows-x64 cli-windows-arm64; do
            echo "Publishing tila-$pkg..."
            cd packages/$pkg
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main CLI package (OIDC)
        working-directory: packages/cli
        run: npm publish --access public --provenance
