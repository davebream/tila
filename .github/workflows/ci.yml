name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the 15-sample concurrency benchmark
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gitleaks-action lists PR commits via the GitHub API on pull_request events;
# without these it gets 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'write' || 'read' }}
    env:
      TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve cache identity
        id: cache-key
        run: node scripts/ci-cache-key.mjs

      - name: Restore pnpm downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - name: Restore Turbo results
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.cache-key.outputs.prefix }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize timing summary
        run: |
          echo '| Check | Duration | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"

      - name: Lint and version checks
        run: node scripts/ci-run.mjs lint pnpm lint

      - name: Observe affected package selection
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-select.mjs

      - name: Typecheck
        run: node scripts/ci-run.mjs typecheck node scripts/turbo.mjs run typecheck --summarize --cache-dir=.turbo/cache

      - name: Package tests
        run: node scripts/ci-run.mjs tests node scripts/turbo.mjs run test --summarize --cache-dir=.turbo/cache

      - name: Root script tests
        run: node scripts/ci-run.mjs scripts pnpm run test:scripts

      - name: Dependency audit
        run: node scripts/ci-run.mjs audit pnpm audit --audit-level=high

      - name: Save trusted pnpm downloads
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - name: Save trusted Turbo results
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.cache-key.outputs.prefix }}-turbo-${{ github.sha }}

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ github.run_attempt }}
          path: |
            .ci-reports/
            .turbo/runs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    if: ${{ always() }}
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Require every check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci-gate.sh

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-benchmark.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: concurrency-benchmark
          path: .ci-reports/
          include-hidden-files: true
          retention-days: 7
