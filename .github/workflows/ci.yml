name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the 15-sample concurrency benchmark
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# gitleaks-action lists PR commits via the GitHub API on pull_request events;
# without these it gets 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cache-mode: read
    outputs:
      scopes_payload: ${{ steps.selection.outputs.scopes_payload }}
    env:
      TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve cache identity
        id: cache-key
        run: node scripts/ci-cache-key.mjs

      - name: Restore pnpm downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - name: Restore Turbo results
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.cache-key.outputs.prefix }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize timing summary
        run: |
          echo '| Check | Duration | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"

      - name: Lint and version checks
        run: node scripts/ci-run.mjs lint pnpm lint

      - name: Resolve queue-aware comparison commits
        id: scope-refs
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true # Missing refs produce an all-scopes barrier.
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: scopes-git-refs

      - name: Compute affected package scopes
        id: selection
        env:
          CI_BASE_SHA: ${{ steps.scope-refs.outputs.base }}
          CI_HEAD_SHA: ${{ steps.scope-refs.outputs.head }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-select.mjs

      - name: Typecheck
        run: node scripts/ci-run.mjs typecheck node scripts/turbo.mjs run typecheck --summarize --cache-dir=.turbo/cache

      - name: Package tests
        run: node scripts/ci-run.mjs tests node scripts/turbo.mjs run test --summarize --cache-dir=.turbo/cache

      - name: Root script tests
        run: node scripts/ci-run.mjs scripts pnpm run test:scripts

      - name: Dependency audit
        run: node scripts/ci-run.mjs audit pnpm audit --audit-level=high

      - name: Export successful main task cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: tar -czf "$RUNNER_TEMP/turbo-cache.tar.gz" .turbo/cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: trusted-task-cache
          path: ${{ runner.temp }}/turbo-cache.tar.gz
          retention-days: 1

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.run_attempt }}
          path: |
            .ci-reports/
            .turbo/runs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  scopes:
    # Forks and Dependabot do not receive this secret; missing scopes use
    # Mergify's conservative catch-all behavior. Never use pull_request_target.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      # No checkout, installs or repository code runs in this job.
      - name: Validate scope payload
        env:
          SCOPE_PAYLOAD: ${{ needs.verify.outputs.scopes_payload }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -e --arg head "$PR_HEAD" '
            .head_ref == $head and
            (.all_scopes | type == "boolean") and
            (.scopes | type == "array") and
            (.scopes | length <= 10000) and
            (.all_scopes or (.scopes | length > 0)) and
            all(.scopes[]; type == "string" and test("^(@[a-z0-9-]+/)?[a-z0-9._-]+$"))
          ' <<< "$SCOPE_PAYLOAD"
          jq '{scopes, all_scopes}' <<< "$SCOPE_PAYLOAD" > "$RUNNER_TEMP/mergify-scopes.json"
      - name: Upload scopes for this PR revision
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$MERGIFY_TOKEN" || { echo '::error::MERGIFY_TOKEN is required'; exit 1; }
          curl --fail-with-body --silent --show-error --retry 3 \
            --request PUT \
            --header "Authorization: Bearer $MERGIFY_TOKEN" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/mergify-scopes.json" \
            "https://api.mergify.com/v1/repos/$REPOSITORY/commits/$PR_HEAD/scopes"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    if: ${{ always() }}
    needs: [verify, secrets, runtime, consumer-node22, scopes, update-native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["verify","secrets","runtime","consumer-node22","update-native"]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') && '["verify","secrets","runtime","scopes","update-native"]' || '["verify","secrets","runtime","update-native"]' }}
        run: bash scripts/ci-gate.sh

  update-native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Verify native self-update and package-manager handoff
        run: node --test scripts/self-update-native.test.mjs

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-benchmark.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: concurrency-benchmark
          path: .ci-reports/
          include-hidden-files: true
          retention-days: 7

  save-cache:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, secrets, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve cache identity
        id: cache-key
        run: node scripts/ci-cache-key.mjs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-task-cache
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/turbo-cache.tar.gz"
      - run: pnpm fetch --frozen-lockfile
      - name: Save trusted pnpm downloads
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - name: Save trusted Turbo results
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.cache-key.outputs.prefix }}-turbo-${{ github.sha }}


  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve cache identity
        id: cache-key
        run: node scripts/ci-cache-key.mjs

      - name: Restore pnpm downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-run.mjs runtime pnpm test:runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: runtime-diagnostics
          path: .ci-reports/
          include-hidden-files: true
          retention-days: 7

  consumer-node22:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Resolve cache identity
        id: cache-key
        run: node scripts/ci-cache-key.mjs

      - name: Restore pnpm downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ steps.cache-key.outputs.prefix }}-pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-run.mjs consumer-node22 node scripts/turbo.mjs run test --filter=tila-sdk --filter=tila-mcp-server --force --summarize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: consumer-node22-diagnostics
          path: .ci-reports/
          include-hidden-files: true
          retention-days: 7
