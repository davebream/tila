merge_queue:
  mode: serial
  max_parallel_checks: 1

# CI computes scopes from Turbo's affected packages, including dependents.
scopes:
  source:
    manual:

queue_rules:
  - name: default
    # Validate up to three PRs together, with only one batch running at a time.
    # GitHub must require ci without requiring each original branch to be current:
    # Mergify validates the combined changes against main on a temporary batch PR.
    batch_size: 3
    batch_max_wait_time: 30 seconds
    merge_method: squash
    update_method: merge
    queue_conditions:
      - base = main
      - -draft
      - label = merge-ready
      - check-success = ci

merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label = merge-ready
